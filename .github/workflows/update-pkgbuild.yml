name: Update linux-ck PKGBUILD

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y jq gettext-base patch

      - name: Regenerate PKGBUILD
        run: bash scripts/update-pkgbuild.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD config
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          pkgver="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          git commit -m "chore: update linux-ck PKGBUILD to ${pkgver}"
          git push
